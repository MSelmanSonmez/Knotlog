name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          case "$RUNNER_OS" in
            Linux)   # apt's 0.9.0 runs out of memory on tests/run.sh
                     v=v0.11.0
                     curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/$v/shellcheck-$v.linux.x86_64.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
                     mkdir -p "$HOME/.local/bin"
                     cp "$RUNNER_TEMP/shellcheck-$v/shellcheck" "$HOME/.local/bin/"
                     echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                     "$HOME/.local/bin/shellcheck" --version ;;
            macOS)   HOMEBREW_NO_REQUIRE_TAP_TRUST=1 brew install shellcheck ;;
            Windows) choco install shellcheck -y ;;
          esac
      - name: Run tests
        run: sh tests/run.sh
